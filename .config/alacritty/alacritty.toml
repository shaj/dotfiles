
import = [
    "~/.config/alacritty/themes/themes/tango_dark.toml"
]

[window]

dimensions.columns = 140
dimensions.lines = 50

resize_increments = true


[font]
normal.family = "Liberation Mono"
bold.family = "Liberation Mono"
italic.family = "Liberation Mono"
bold_italic.family = "Liberation Mono"

# normal.family = "FreeMono"
# bold.family = "FreeMono"
# italic.family = "FreeMono"
# bold_italic.family = "FreeMono"

size = 10.0

[keyboard]
bindings = [
    { key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
    { key = "F11", action = "ToggleFullscreen" },
]

